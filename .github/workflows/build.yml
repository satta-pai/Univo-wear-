name: Build UNIVO WEAR Hybrid Android APK & Website
on:
  push:
    branches:
    - main
    - master
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build-hybrid-apk:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4
    - name: 2. Locate Web App HTML (Supports nested zip folders & direct HTML)
      run: 'mkdir -p /tmp/univo_web /tmp/univo_zip && for z in *.zip; do if [ -f "$z" ]; then unzip -o "$z" -d /tmp/univo_zip; fi; done && FOUND_HTML=$(find . /tmp/univo_zip -type f \( -name "dress_shop_tracker.html" -o -name "app.html" -o -name "index.html" \) | head -n 1) && echo "Found HTML: $FOUND_HTML" && cp -f "$FOUND_HTML" /tmp/univo_web/index.html && test -s /tmp/univo_web/index.html'
    - name: 3. Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '17'
    - name: 4. Print Android SHA-1 & SHA-256 Fingerprints for Firebase Google Sign-In
      run: mkdir -p ~/.android && if [ ! -f ~/.android/debug.keystore ]; then keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'; fi && echo '### 🔑 UNIVO WEAR Android SHA-1 Fingerprint (For Firebase Console)' >> $GITHUB_STEP_SUMMARY && echo 'Copy the **SHA1** below and add it in **Firebase Console -> Project Settings -> Your Apps -> Android App (com.univowear.pos)**:' >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA256:' >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY
    - name: 5. Setup Flutter Stable
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - name: 6. Create Flutter Base FIRST, Then Overwrite with UNIVO WEAR Hybrid WebView Engine
      run: flutter create --org com.univowear.pos --project-name univo_wear . && mkdir -p assets/www lib build/web && cp -f /tmp/univo_web/index.html assets/www/index.html && cp -f /tmp/univo_web/index.html build/web/index.html && echo '' | base64 -d > pubspec.yaml && echo '' | base64 -d > lib/main.dart && echo '' | base64 -d > /tmp/patch_manifest.py && python3 /tmp/patch_manifest.py && rm -rf test/widget_test.dart
        && flutter pub get
    - name: 7. Build UNIVO WEAR Release Android APK
      run: flutter build apk --release --no-tree-shake-icons && mkdir -p apk_out && cp -f build/app/outputs/flutter-apk/app-release.apk apk_out/UNIVO-WEAR-POS.apk
    - name: 8. Upload Downloadable UNIVO WEAR Android APK
      uses: actions/upload-artifact@v4
      with:
        name: UNIVO-WEAR-Android-APK
        path: apk_out/UNIVO-WEAR-POS.apk
    - name: 9. Upload Downloadable Website HTML Bundle
      uses: actions/upload-artifact@v4
      with:
        name: UNIVO-WEAR-Website-Files
        path: build/web/
