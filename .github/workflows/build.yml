
name: Build UNIVO WEAR Android APK & Deploy Live Domain
​on:
push:
branches: [ main, master ]
workflow_dispatch:
​permissions:
contents: write
pages: write
id-token: write
​jobs:
build-apk-and-deploy-web:
runs-on: ubuntu-latest
​steps:
- name: 1. Checkout Repository
uses: actions/checkout@v4
​- name: 2. Auto-Prepare Web App (index.html) for Live HTTPS Domain
run: |
mkdir -p web_deploy
if [ -f "dress_shop_tracker.html" ]; then
cp dress_shop_tracker.html web_deploy/index.html
cp dress_shop_tracker.html index.html
elif [ -f "index.html" ]; then
cp index.html web_deploy/index.html
elif [ -f "univo_wear_flutter.zip" ]; then
unzip -o univo_wear_flutter.zip -d .
if [ -f "web_pos/index.html" ]; then
cp web_pos/index.html web_deploy/index.html
cp web_pos/index.html index.html
fi
fi
​- name: 3. Setup Java 17 for Android Build
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: 4. Print Android SHA-1 & SHA-256 Fingerprints for Google Sign-In
run: |
mkdir -p ~/.android
if [ ! -f ~/.android/debug.keystore ]; then
keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
fi
echo "### 🔑 Android Google Auth Certificate Fingerprints" >> $GITHUB_STEP_SUMMARY
echo "Copy the SHA1 below and add it in Firebase Console -> Project Settings -> Your Apps -> Android App (com.univowear.pos):" >> $GITHUB_STEP_SUMMARY
echo '' >> $GITHUB_STEP_SUMMARY keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" >> $GITHUB_STEP_SUMMARY echo '' >> $GITHUB_STEP_SUMMARY
​# ========================================================================
# MODE A: If univo_wear_flutter.zip or pubspec.yaml is present -> Auto-Unzip & Build Flutter APK
# ========================================================================
- name: 5A. Auto-Unzip & Build Flutter Native APK (if zip or pubspec present)
if: hashFiles('univo_wear_flutter.zip') != '' || hashFiles('pubspec.yaml') != ''
uses: subosito/flutter-action@v2
with:
channel: 'stable'
cache: true
​- name: 5B. Compile Flutter APK
if: hashFiles('univo_wear_flutter.zip') != '' || hashFiles('pubspec.yaml') != ''
run: |
if [ -f "univo_wear_flutter.zip" ]; then
echo "Auto-extracting univo_wear_flutter.zip on GitHub Server..."
unzip -o univo_wear_flutter.zip -d .
fi
flutter create --org com.univowear.pos --project-name univo_wear .
flutter pub get
flutter build apk --release --no-tree-shake-icons
mkdir -p apk_out
cp build/app/outputs/flutter-apk/app-release.apk apk_out/UNIVO-WEAR-Flutter-POS.apk
​# ========================================================================
# MODE B: Zero-Zip Fallback! Build Android APK directly from dress_shop_tracker.html
# ========================================================================
- name: 6A. Setup Node.js (for Single-File HTML -> Android APK Builder)
if: hashFiles('univo_wear_flutter.zip') == '' && hashFiles('pubspec.yaml') == ''
uses: actions/setup-node@v4
with:
node-version: '20'
​- name: 6B. Build Android APK Directly from dress_shop_tracker.html (Zero Zip Needed!)
if: hashFiles('univo_wear_flutter.zip') == '' && hashFiles('pubspec.yaml') == ''
run: |
mkdir -p www apk_out
cp index.html www/index.html
npm init -y
npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/android@5
npx cap init "UNIVO WEAR" "com.univowear.pos" --web-dir www
npx cap add android
npx cap copy android
cd android
chmod +x gradlew
./gradlew assembleDebug
cp app/build/outputs/apk/debug/app-debug.apk ../apk_out/UNIVO-WEAR-POS.apk
​- name: 7. Upload Downloadable Android APK Artifact
uses: actions/upload-artifact@v4
with:
name: UNIVO-WEAR-Android-APK
path: apk_out/*.apk
​- name: 8. Upload Web App for GitHub Pages (HTTPS Domain for Google Auth)
if: hashFiles('web_deploy/index.html') != ''
uses: actions/upload-pages-artifact@v3
with:
path: ./web_deploy
​- name: 9. Deploy Live HTTPS Domain to GitHub Pages
if: hashFiles('web_deploy/index.html') != ''
id: deployment
uses: actions/deploy-pages@v4
