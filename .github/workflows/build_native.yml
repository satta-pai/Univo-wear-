name: Build & Auto-Release UNIVO WEAR Native APK v26
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-native-flutter-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: 3. Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 4. Overlay UNIVO WEAR Brand Logo, Fixed Keystore & Dart Source
        run: mkdir -p /tmp/native_src && if [ -f univo_wear_native_flutter.zip ]; then unzip -o univo_wear_native_flutter.zip -d /tmp/native_src; else cp -r . /tmp/native_src; fi && flutter create --org com.univowear.pos --project-name univo_wear . && SRC_DIR=$(dirname $(find /tmp/native_src -name pubspec.yaml | head -n 1)) && cp -rf "$SRC_DIR/lib" . && cp -rf "$SRC_DIR/assets" . && cp -f "$SRC_DIR/pubspec.yaml" . && if [ -f "$SRC_DIR/univo_wear_fixed.jks" ]; then cp -f "$SRC_DIR/univo_wear_fixed.jks" .; fi && rm -rf test/widget_test.dart && echo '' | base64 -d > /tmp/patch_android_native.py && python3 /tmp/patch_android_native.py && flutter pub get && (flutter analyze --no-fatal-infos --no-fatal-warnings || true)
      - name: 5. Build Signed UNIVO WEAR Native Android APK
        run: mkdir -p apk_out && if flutter build apk --release --no-tree-shake-icons; then cp -f build/app/outputs/flutter-apk/app-release.apk apk_out/UNIVO-WEAR-Native-POS.apk; else flutter build apk --debug && cp -f build/app/outputs/flutter-apk/app-debug.apk apk_out/UNIVO-WEAR-Native-POS.apk; fi && test -s apk_out/UNIVO-WEAR-Native-POS.apk
      - name: 6. Upload Pure Native Android APK
        uses: actions/upload-artifact@v4
        with:
          name: UNIVO-WEAR-Native-Android-APK
          path: apk_out/UNIVO-WEAR-Native-POS.apk
      - name: 7. Auto-Publish Signed APK to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r') && TAG="v${VER}" && if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" apk_out/UNIVO-WEAR-Native-POS.apk --clobber; else gh release create "$TAG" apk_out/UNIVO-WEAR-Native-POS.apk --title "UNIVO WEAR $TAG" --notes "Latest UNIVO WEAR Pure Native POS APK ($TAG). Updates in-place with zero data loss."; fi
