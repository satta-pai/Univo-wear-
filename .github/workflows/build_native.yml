name: Build UNIVO WEAR Pure Native Flutter APK v17
on:
  push:
    branches:
    - main
    - master
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-native-flutter-apk:
    runs-on: ubuntu-latest
    steps:
    - name: 1. Checkout Repository
      uses: actions/checkout@v4
    - name: 2. Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: '17'
    - name: 3. Print Android SHA-1 Fingerprint for Firebase Google Sign-In
      run: mkdir -p ~/.android && if [ ! -f ~/.android/debug.keystore ]; then keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'; fi && echo '### 🔑 UNIVO WEAR Native Android SHA-1 Fingerprint' >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA256:' >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY
    - name: 4. Setup Flutter Stable
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
    - name: 5. Create Android Platform FIRST, Overlay Pure Native Dart & Patch minSdk 23 + Lint
      run: mkdir -p /tmp/native_src && if [ -f univo_wear_native_flutter.zip ]; then unzip -o univo_wear_native_flutter.zip -d /tmp/native_src; else cp -r . /tmp/native_src; fi && flutter create --org com.univowear.pos --project-name univo_wear . && SRC_DIR=$(dirname $(find /tmp/native_src -name pubspec.yaml | head -n 1)) && cp -rf "$SRC_DIR/lib" . && cp -f "$SRC_DIR/pubspec.yaml" . && rm -rf test/widget_test.dart && echo '' | base64 -d > /tmp/patch_android_native.py && python3 /tmp/patch_android_native.py && flutter pub get && flutter analyze --no-fatal-infos --no-fatal-warnings
    - name: 6. Build Pure Native Android APK (Release + Auto-Fallback)
      run: mkdir -p apk_out && if flutter build apk --release --no-tree-shake-icons; then cp -f build/app/outputs/flutter-apk/app-release.apk apk_out/UNIVO-WEAR-Native-POS.apk; else flutter build apk --debug && cp -f build/app/outputs/flutter-apk/app-debug.apk apk_out/UNIVO-WEAR-Native-POS.apk; fi && test -s apk_out/UNIVO-WEAR-Native-POS.apk
    - name: 7. Upload Pure Native Android APK
      uses: actions/upload-artifact@v4
      with:
        name: UNIVO-WEAR-Native-Android-APK
        path: apk_out/UNIVO-WEAR-Native-POS.apk
